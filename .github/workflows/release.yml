name: Compile Release
on:
  push:
    tags:
      - '*'
    # Pushing e.g. release/1.0.21-fork cuts that release. For when tags cannot be pushed directly but
    # branches can; the tag itself is created server-side by the Publish Release step.
    branches:
      - 'release/**'
  # Manual fallback, e.g. cutting a release from the Actions tab.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create and release, e.g. 1.0.21-fork'
        required: true
        type: string

jobs:
  build-release:
    runs-on: ubuntu-latest
    # Needed for the Publish Release step; the default GITHUB_TOKEN is read-only in many repos.
    permissions:
      contents: write
    steps:
      # Every trigger carries the tag name somewhere different. Read them from the environment rather than
      # interpolating into the script, so a branch or input name cannot inject shell.
      - name: Resolve release tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${GITHUB_REF#refs/heads/release/}"
          fi
          if [ -z "${TAG}" ] || [ "${TAG}" = "${GITHUB_REF}" ]; then
            echo "Could not determine a release tag from ${GITHUB_REF}" >&2
            exit 1
          fi
          echo "RELEASE_TAG=${TAG}" >> "${GITHUB_ENV}"
          echo "Releasing as ${TAG}"

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build Inx
        run: pio run -e gh_release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Inx-${{ env.RELEASE_TAG }}
          path: |
            .pio/build/gh_release/bootloader.bin
            .pio/build/gh_release/firmware.bin
            .pio/build/gh_release/firmware.elf
            .pio/build/gh_release/firmware.map
            .pio/build/gh_release/partitions.bin

      # On-device OTA polls /releases/latest and looks for an asset named exactly "firmware.bin", so this must
      # publish a real Release (not just workflow artifacts). Keep the asset list to firmware.bin alone: the
      # whole release JSON has to fit OtaUpdater's 12 KB cap, which the release body and asset objects share.
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: .pio/build/gh_release/firmware.bin
          # Explicit on both paths: on a manual run this creates the tag at the checked-out commit.
          tag_name: ${{ env.RELEASE_TAG }}
          # Drafts and prereleases are invisible to /releases/latest.
          draft: false
          prerelease: false

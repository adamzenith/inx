name: Compile Release
on:
  push:
    tags:
      - '*'
  # Manual fallback for when a tag cannot be pushed directly (restricted push access, or cutting a release
  # from the web UI). Creates the tag at the checked-out commit as part of publishing the release.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create and release, e.g. 1.0.21-fork'
        required: true
        type: string

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      # A tag push already carries the name in github.ref_name; a manual run supplies it as an input.
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    # Needed for the Publish Release step; the default GITHUB_TOKEN is read-only in many repos.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build Inx
        run: pio run -e gh_release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Inx-${{ env.RELEASE_TAG }}
          path: |
            .pio/build/gh_release/bootloader.bin
            .pio/build/gh_release/firmware.bin
            .pio/build/gh_release/firmware.elf
            .pio/build/gh_release/firmware.map
            .pio/build/gh_release/partitions.bin

      # On-device OTA polls /releases/latest and looks for an asset named exactly "firmware.bin", so this must
      # publish a real Release (not just workflow artifacts). Keep the asset list to firmware.bin alone: the
      # whole release JSON has to fit OtaUpdater's 12 KB cap, which the release body and asset objects share.
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: .pio/build/gh_release/firmware.bin
          # Explicit on both paths: on a manual run this creates the tag at the checked-out commit.
          tag_name: ${{ env.RELEASE_TAG }}
          # Drafts and prereleases are invisible to /releases/latest.
          draft: false
          prerelease: false
